<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA Transit — How far can you go by train?</title>
  <meta name="description" content="Interactive map of how far you can travel by train from any station in Malaysia, Singapore and Thailand, from 1 to 48 hours.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SEA Transit — How far can you go by train?">
  <meta property="og:description" content="Approximate train reachability from stations across Malaysia, Singapore and Thailand.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚆</text></svg>">
</head>
<body>
  <header id="topbar">
    <a class="brand" href="./">SEA Transit</a>
    <nav>
      <a href="https://github.com/EdwardYWY/seatransit" target="_blank" rel="noreferrer">GitHub</a>
      <span>Prototype</span>
    </nav>
  </header>
  <div id="map"></div>
  <div id="loading" role="status" aria-live="polite">Loading data...</div>
  <div id="error" role="alert"></div>
  <div id="panel-wrap">
  <section id="control-panel" aria-label="Reachability controls">
    <h1 id="origin-heading">How far can you go by train from KL Sentral?</h1>
    <div id="slider-value" role="status">4h · loading…</div>
    <div class="panel-body">
      <div class="panel-actions">
        <button type="button" class="icon-button" id="play-button" aria-label="Play time animation">▶</button>
        <button type="button" class="icon-button" id="stop-button" aria-label="Reset time">■</button>
        <div id="search-overlay">
          <input id="search-input" type="text" placeholder="Other station..." autocomplete="off" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-autocomplete="list" aria-controls="search-results" aria-label="Search stations">
          <div id="search-results" role="listbox"></div>
        </div>
      </div>
      <div id="slider-overlay">
        <input type="range" id="time-slider" min="0" max="10" value="4" step="1" aria-label="Maximum travel time" aria-valuetext="4 hours">
        <div id="slider-labels">
          <span>0h</span><span>1h</span><span>2h</span><span>3h</span><span>4h</span>
          <span>6h</span><span>8h</span><span>12h</span><span>24h</span><span>36h</span><span>48h</span>
        </div>
      </div>
    </div>
    <div class="data-note">Approximate rail-corridor coverage from static GTFS · not live journey planning</div>
  </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
